<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — WebCraft MA</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#080b10;--surface:#0f1318;--s2:#131820;--border:#1e2530;--accent:#e8c44a;--text:#e8ecf0;--muted:#6b7a8d;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

    #login{min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .lbox{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3rem;width:340px;text-align:center;}
    .lbox h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;color:var(--accent);margin-bottom:.25rem;}
    .lbox p{color:var(--muted);font-size:.875rem;margin-bottom:2rem;}
    .lbox input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.85rem 1rem;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none;margin-bottom:1rem;}
    .lbox input:focus{border-color:var(--accent);}
    .lbox button{width:100%;background:var(--accent);color:#080b10;border:none;padding:.9rem;border-radius:4px;font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:1px;cursor:pointer;font-family:'DM Sans',sans-serif;}
    .lerr{color:#ef4444;font-size:.8rem;margin-top:.75rem;display:none;}

    #dash{display:none;}
    .sidebar{position:fixed;top:0;left:0;width:210px;height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:6px;}
    .slogo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;color:var(--accent);padding:0 8px 1.25rem;border-bottom:1px solid var(--border);margin-bottom:8px;}
    .nitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:5px;font-size:.875rem;color:var(--muted);transition:all .2s;text-decoration:none;}
    .nitem:hover,.nitem.active{background:rgba(232,196,74,.08);color:var(--text);}
    .nitem.active{border-left:3px solid var(--accent);}
    .nbottom{margin-top:auto;}
    .bout{width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);padding:.5rem;border-radius:4px;cursor:pointer;font-size:.8rem;font-family:'DM Sans',sans-serif;transition:all .2s;}
    .bout:hover{border-color:#ef4444;color:#ef4444;}
    .main{margin-left:210px;padding:2rem;}

    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;}
    .topbar h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
    .tactions{display:flex;gap:.75rem;}
    .btn{padding:.5rem 1.25rem;border-radius:4px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.825rem;font-weight:600;transition:all .2s;}
    .bac{background:var(--accent);color:#080b10;}.bac:hover{background:#f0d060;}
    .bgh{background:transparent;color:var(--muted);border:1px solid var(--border);}.bgh:hover{border-color:var(--accent);color:var(--text);}

    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
    .sc{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1.25rem;}
    .sl{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.5rem;}
    .sv{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:1px;}

    .tc{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
    .tt{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .tt h2{font-size:1rem;font-weight:600;}
    .sinput{background:var(--s2);border:1px solid var(--border);border-radius:5px;padding:.5rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.875rem;outline:none;width:240px;}
    .sinput:focus{border-color:var(--accent);}
    .fr{display:flex;gap:.5rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--border);}
    .fb{padding:4px 14px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.78rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
    .fb.active{background:rgba(232,196,74,.1);border-color:rgba(232,196,74,.4);color:var(--accent);}
    table{width:100%;border-collapse:collapse;}
    th{padding:.75rem 1rem;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);}
    td{padding:.9rem 1rem;font-size:.875rem;border-bottom:1px solid rgba(30,37,48,.5);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(255,255,255,.015);}

    .badge{display:inline-block;padding:3px 10px;border-radius:3px;font-size:.72rem;font-weight:600;}
    .b-nouveau{background:rgba(232,196,74,.1);color:#fcd34d;border:1px solid rgba(232,196,74,.2);}
    .b-en_cours{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2);}
    .b-termine{background:rgba(34,197,94,.1);color:#4ade80;border:1px solid rgba(34,197,94,.2);}
    .b-annule{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);}
    .tb{display:inline-block;padding:2px 8px;border-radius:3px;font-size:.72rem;}
    .tb-vitrine{background:rgba(59,130,246,.1);color:#60a5fa;}
    .tb-ecommerce{background:rgba(168,85,247,.1);color:#c084fc;}
    .tb-landing{background:rgba(34,197,94,.1);color:#4ade80;}
    .tb-webapp{background:rgba(251,146,60,.1);color:#fb923c;}
    .tb-autre,.tb-x{background:rgba(100,116,139,.1);color:#94a3b8;}
    .ft{display:inline-block;background:rgba(232,196,74,.07);color:var(--accent);padding:1px 7px;border-radius:3px;font-size:.68rem;border:1px solid rgba(232,196,74,.12);margin:1px;}
    .ab{background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--muted);padding:3px 10px;font-size:.75rem;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
    .ab:hover{border-color:var(--accent);color:var(--text);}
    .ab.del:hover{border-color:#ef4444;color:#ef4444;}
    .empty{text-align:center;padding:4rem;color:var(--muted);}
    .empty .icon{font-size:2.5rem;margin-bottom:1rem;}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center;}
    .modal.open{display:flex;}
    .mbox{background:var(--surface);border:1px solid rgba(232,196,74,.15);border-radius:10px;padding:2rem;width:480px;max-width:90vw;}
    .mtitle{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;margin-bottom:1.5rem;color:var(--accent);}
    .dr{display:flex;justify-content:space-between;align-items:flex-start;padding:.75rem 0;border-bottom:1px solid var(--border);}
    .dr:last-child{border-bottom:none;}
    .dl{color:var(--muted);font-size:.8rem;}
    .dv{font-size:.875rem;text-align:right;max-width:280px;}
    .ma{display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap;}

    .notif{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid rgba(232,196,74,.2);border-radius:6px;padding:.75rem 1.5rem;font-size:.875rem;display:none;z-index:999;white-space:nowrap;}
  </style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>WebCraft MA</h1>
    <p>Espace administrateur</p>
    <input type="password" id="pwd" placeholder="Mot de passe"/>
    <button onclick="login()">Connexion →</button>
    <div class="lerr" id="lerr">Mot de passe incorrect</div>
  </div>
</div>

<div id="dash">
  <div class="sidebar">
    <div class="slogo">WebCraft <span style="color:var(--muted);font-size:.7em">MA</span></div>
    <a href="/" class="nitem">🌐 Site principal</a>
    <a href="#" class="nitem active">📊 Dashboard</a>
    <div class="nbottom"><button class="bout" onclick="logout()">Déconnexion</button></div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1>Tableau de Bord</h1>
      <div class="tactions">
        <button class="btn bgh" onclick="load()">↻ Actualiser</button>
        <button class="btn bac" onclick="exportCSV()">⬇ CSV</button>
      </div>
    </div>

    <div class="stats">
      <div class="sc"><div class="sl">Total</div><div class="sv" id="s0" style="color:var(--accent)">—</div></div>
      <div class="sc"><div class="sl">Nouveaux</div><div class="sv" id="s1" style="color:#fcd34d">—</div></div>
      <div class="sc"><div class="sl">En Cours</div><div class="sv" id="s2" style="color:#60a5fa">—</div></div>
      <div class="sc"><div class="sl">Terminés</div><div class="sv" id="s3" style="color:#4ade80">—</div></div>
    </div>

    <div class="tc">
      <div class="tt">
        <h2>Demandes de Projets</h2>
        <input class="sinput" id="search" placeholder="🔍 Nom, email..." oninput="render()"/>
      </div>
      <div class="fr">
        <button class="fb active" onclick="setF('all',this)">Tous</button>
        <button class="fb" onclick="setF('nouveau',this)">🟡 Nouveau</button>
        <button class="fb" onclick="setF('en_cours',this)">🔵 En cours</button>
        <button class="fb" onclick="setF('termine',this)">🟢 Terminé</button>
        <button class="fb" onclick="setF('annule',this)">🔴 Annulé</button>
      </div>
      <div id="wrap"><div class="empty"><div class="icon">⏳</div><p>Chargement...</p></div></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <div class="mtitle">Détails du Projet</div>
    <div id="mbody"></div>
    <div class="ma">
      <button class="btn bac" onclick="upd(cid,'en_cours')">🔵 En cours</button>
      <button class="btn bgh" onclick="upd(cid,'termine')">🟢 Terminé</button>
      <button class="btn bgh" onclick="upd(cid,'annule')">🔴 Annuler</button>
      <button class="btn bgh" onclick="closeM()">Fermer</button>
    </div>
  </div>
</div>
<div class="notif" id="notif"></div>

<script>
  const PWD = 'admin123';
  let data = [], filter = 'all', cid = null;

  function login() {
    if (document.getElementById('pwd').value === PWD) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
      load();
    } else { document.getElementById('lerr').style.display = 'block'; }
  }
  document.addEventListener('keydown', e => { if(e.key==='Enter' && document.getElementById('login').style.display!=='none') login(); });
  function logout() { document.getElementById('login').style.display='flex'; document.getElementById('dash').style.display='none'; document.getElementById('pwd').value=''; }

  async function load() {
    try {
      const res = await fetch('/api/requests');
      data = await res.json();
      stats(); render();
    } catch(e) {
      document.getElementById('wrap').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>Erreur: ${e.message}</p></div>`;
    }
  }

  function stats() {
    document.getElementById('s0').textContent = data.length;
    document.getElementById('s1').textContent = data.filter(d=>d.statut==='nouveau').length;
    document.getElementById('s2').textContent = data.filter(d=>d.statut==='en_cours').length;
    document.getElementById('s3').textContent = data.filter(d=>d.statut==='termine').length;
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const rows = data.filter(d => (filter==='all'||d.statut===filter) && (!q||JSON.stringify(d).toLowerCase().includes(q)));
    if (!rows.length) { document.getElementById('wrap').innerHTML='<div class="empty"><div class="icon">📭</div><p>Aucune demande.</p></div>'; return; }
    const tc = t => ['vitrine','ecommerce','landing','webapp'].includes(t)?t:'x';
    document.getElementById('wrap').innerHTML = `<table><thead><tr><th>Client</th><th>Type</th><th>Budget</th><th>Features</th><th>Statut</th><th>Date</th><th></th></tr></thead><tbody>${
      rows.map(d=>`<tr>
        <td><strong>${d.name}</strong><br><small style="color:var(--muted)">📞 ${d.phone}</small><br><small style="color:var(--muted)">✉️ ${d.email}</small></td>
        <td><span class="tb tb-${tc(d.site_type)}">${d.site_type||'—'}</span></td>
        <td style="color:var(--muted);font-size:.82rem">${d.budget||'—'}</td>
        <td>${(d.features||[]).map(f=>`<span class="ft">${f}</span>`).join('')||'—'}</td>
        <td><span class="badge b-${d.statut||'nouveau'}">${d.statut||'nouveau'}</span></td>
        <td style="color:var(--muted);font-size:.8rem">${fmt(d.created_at)}</td>
        <td><button class="ab" onclick="detail(${d.id})">Détails</button> <button class="ab del" onclick="del(${d.id})">✕</button></td>
      </tr>`).join('')
    }</tbody></table>`;
  }

  function setF(f,btn) { filter=f; document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }

  function detail(id) {
    cid=id; const d=data.find(x=>x.id===id); if(!d) return;
    document.getElementById('mbody').innerHTML=[
      ['Nom',d.name],['Téléphone',d.phone],['Email',d.email],
      ['Type',d.site_type],['Budget',d.budget||'—'],
      ['Features',(d.features||[]).join(', ')||'—'],
      ['Description',d.description||'—'],
      ['Statut',`<span class="badge b-${d.statut}">${d.statut}</span>`],
      ['Date',new Date(d.created_at).toLocaleString('fr-MA')],
    ].map(([l,v])=>`<div class="dr"><span class="dl">${l}</span><span class="dv">${v}</span></div>`).join('');
    document.getElementById('modal').classList.add('open');
  }
  function closeM() { document.getElementById('modal').classList.remove('open'); cid=null; }

  async function upd(id,statut) {
    try {
      await fetch(`/api/requests?id=${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({statut})});
      notify(`✅ Statut: ${statut}`); closeM(); load();
    } catch { notify('❌ Erreur'); }
  }
  async function del(id) {
    if(!confirm('Supprimer?')) return;
    try { await fetch(`/api/requests?id=${id}`,{method:'DELETE'}); notify('🗑 Supprimé'); load(); }
    catch { notify('❌ Erreur'); }
  }

  function exportCSV() {
    const h=['ID','Nom','Téléphone','Email','Type','Budget','Features','Description','Statut','Date'];
    const rows=data.map(d=>[d.id,d.name,d.phone,d.email,d.site_type,d.budget,(d.features||[]).join('|'),(d.description||'').replace(/,/g,' '),d.statut,d.created_at].join(','));
    const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent([h.join(','),...rows].join('\n')); a.download='webcraft.csv'; a.click();
  }

  function fmt(iso) { if(!iso) return '—'; return new Date(iso).toLocaleDateString('fr-MA',{day:'2-digit',month:'short',year:'numeric'}); }
  function notify(msg) { const n=document.getElementById('notif'); n.textContent=msg; n.style.display='block'; setTimeout(()=>n.style.display='none',3000); }

  setInterval(()=>{ if(document.getElementById('dash').style.display!=='none') load(); },60000);
</script>
</body>
</html>
