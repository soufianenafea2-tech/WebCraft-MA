<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merci — WebCraft MA</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#080b10; --accent:#e8c44a; --text:#e8ecf0; --muted:#6b7a8d; --border:#1e2530; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .card {
      background: #0f1318; border: 1px solid var(--border);
      border-radius: 12px; padding: 4rem 3rem; max-width: 500px;
      animation: fadeUp 0.6s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem; letter-spacing: 3px;
      color: var(--accent); margin-bottom: 0.75rem;
    }
    p { color: var(--muted); line-height: 1.7; margin-bottom: 2rem; }
    .btn {
      display: inline-block; background: var(--accent); color: #080b10;
      padding: 0.9rem 2rem; border-radius: 4px;
      font-weight: 700; font-size: 0.9rem;
      text-transform: uppercase; letter-spacing: 1px;
      text-decoration: none; transition: all 0.2s;
    }
    .btn:hover { background: #f0d060; }
    .logo {
      position: fixed; top: 1.5rem; left: 2rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 2px; color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a href="/" class="logo">WebCraft MA</a>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Demande Envoyée !</h1>
    <p>Merci pour votre confiance. J'ai bien reçu votre demande et je vous contacte sous <strong style="color:var(--text)">24h</strong> par WhatsApp ou email.</p>
    <a href="/" class="btn">← Retour au site</a>
  </div>
</body>
</html>
